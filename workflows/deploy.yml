name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # bin/ đã có sẵn .class + res/ + map/ → chỉ cần đóng gói JAR
      - name: Build JAR from existing bin/
        run: |
          printf "Main-Class: main.MainClass\n\n" > MANIFEST.MF
          jar cfm PlatformerGame.jar MANIFEST.MF -C bin .
          echo "✅ JAR size: $(du -h PlatformerGame.jar | cut -f1)"

      # Tạo thư mục web với index.html + JAR
      - name: Create web folder
        run: |
          mkdir -p _site
          cp PlatformerGame.jar _site/

          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <title>Platformer Game</title>
            <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
            <style>
              * { margin:0; padding:0; box-sizing:border-box; }
              body {
                background: #0c0a23;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                font-family: Arial, sans-serif;
                color: #fff;
                gap: 16px;
              }
              h1 { color: #a0c4ff; font-size: 22px; }
              .sub { color: #556; font-size: 13px; }
              #loading { display:flex; flex-direction:column; align-items:center; gap:12px; }
              .spinner {
                width:36px; height:36px;
                border:3px solid #223;
                border-top-color:#4e9af1;
                border-radius:50%;
                animation: spin .8s linear infinite;
              }
              @keyframes spin { to { transform:rotate(360deg); } }
              #status { font-size:13px; color:#88a; }
              cheerpj-display { border:2px solid #223; }
              .keys { font-size:12px; color:#445; text-align:center; line-height:2; }
              kbd {
                background:#1a1a2e; border:1px solid #334;
                border-radius:3px; padding:1px 6px;
                font-size:11px; color:#aac;
              }
            </style>
          </head>
          <body>
            <h1>🎮 Platformer Game</h1>
            <p class="sub">OOP Lab Final · HK2 2025-2026 · HCMIU</p>
            <div id="loading">
              <div class="spinner"></div>
              <div id="status">Đang khởi động, chờ chút...</div>
            </div>
            <cheerpj-display style="display:none"></cheerpj-display>
            <p class="keys" style="display:none" id="keys">
              <kbd>A</kbd> <kbd>D</kbd> di chuyển &nbsp;|&nbsp;
              <kbd>W</kbd> / <kbd>Space</kbd> nhảy &nbsp;|&nbsp;
              <kbd>J</kbd> tấn công &nbsp;|&nbsp;
              <kbd>E</kbd> mở cửa &nbsp;|&nbsp;
              <kbd>Esc</kbd> pause
            </p>
            <script>
              (async () => {
                const status = document.getElementById('status');
                const loading = document.getElementById('loading');
                try {
                  status.textContent = 'Đang tải CheerpJ runtime (~8MB)...';
                  await cheerpjInit({ clipboardMode: 'system' });
                  loading.style.display = 'none';
                  document.querySelector('cheerpj-display').style.display = 'block';
                  document.getElementById('keys').style.display = 'block';
                  await cheerpjRunJar('/app/PlatformerGame.jar');
                } catch(e) {
                  status.textContent = '❌ ' + e.message;
                }
              })();
            </script>
          </body>
          </html>
          HTML

          echo "✅ _site contents:"
          ls -lh _site/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Print URL
        run: echo "🎮 Game live at ${{ steps.deploy.outputs.page_url }}"
