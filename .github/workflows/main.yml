name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java sources
        run: |
          find src -name "*.java" > sources.txt
          javac -encoding UTF-8 --release 8 -sourcepath src -d bin @sources.txt
          echo "Compile done"

      - name: Build JAR
        run: |
          printf "Main-Class: main.MainClass\n\n" > MANIFEST.MF
          jar cfm PlatformerGame.jar MANIFEST.MF -C bin .
          ls -lh PlatformerGame.jar

      - name: Create site
        run: |
          mkdir -p _site
          cp PlatformerGame.jar _site/

      - name: Write index.html
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <title>Kings &amp; Pigs — Platformer</title>
            
            <script>
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  let hasZombie = false;
                  for(let registration of registrations) {
                    registration.unregister();
                    hasZombie = true;
                  }
                  if (hasZombie) {
                    console.log("Đã diệt Service Worker cũ. Đang tải lại trang...");
                    window.location.reload(true); // Ép tải lại bằng cache mới
                  }
                });
              }
            </script>

            <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                background: #0c0a23;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                font-family: Arial, sans-serif;
                color: #fff;
              }
              h1  { font-size: 20px; color: #a0c4ff; }
              .sub { font-size: 12px; color: #667; }
              cheerpj-display {
                display: block;
                width: 640px; 
                height: 448px;
                border: 2px solid #334;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
              }
              .spinner {
                width: 36px; height: 36px;
                border: 3px solid #1a1a3a;
                border-top-color: #4e9af1;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
              }
              @keyframes spin { to { transform: rotate(360deg); } }
              #page-loading { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 10px; }
              #focus-hint {
                font-size: 12px; color: #667;
                display: none;
                animation: pulse 2s ease-in-out infinite;
              }
              @keyframes pulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
              .keys { font-size: 12px; color: #556; text-align: center; line-height: 2.2; }
              kbd {
                background: #1a1a2e; border: 1px solid #334;
                border-radius: 3px; padding: 1px 6px;
                font-size: 11px; color: #aac;
              }
            </style>
          </head>
          <body>
            <h1>🎮 Kings &amp; Pigs</h1>
            <p class="sub">OOP Lab Final · HCMIU HK2 2025-2026</p>

            <div id="page-loading">
              <div class="spinner"></div>
              <div id="page-status">Đang tải máy ảo Java (~8 MB)...</div>
            </div>

            <cheerpj-display id="display"></cheerpj-display>

            <p id="focus-hint">👆 Click vào khung game để bàn phím hoạt động</p>

            <p class="keys">
              <kbd>A</kbd> <kbd>D</kbd> di chuyển &nbsp;|&nbsp;
              <kbd>W</kbd> / <kbd>Space</kbd> nhảy &nbsp;|&nbsp;
              <kbd>J</kbd> / Click trái tấn công &nbsp;|&nbsp;
              <kbd>E</kbd> mở cửa &nbsp;|&nbsp;
              <kbd>Esc</kbd> pause
            </p>

            <script>
              (async () => {
                const pageLoading = document.getElementById('page-loading');
                const hint        = document.getElementById('focus-hint');

                try {
                  await cheerpjInit({ clipboardMode: 'java' });
                  
                  pageLoading.style.display = 'none';
                  hint.style.display        = 'block';

                  let basePath = new URL('.', window.location.href).pathname;
                  let jarPath = ('/app' + basePath + 'PlatformerGame.jar').replace(/\/\//g, '/');
                  
                  console.log('[CheerpJ] Khởi chạy game từ:', jarPath);
                  await cheerpjRunJar(jarPath);

                } catch (e) {
                  console.error('[CheerpJ Lỗi Cực Trọng]', e);
                  alert('Lỗi: ' + e.message);
                }
              })();
            </script>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
