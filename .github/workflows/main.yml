name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java sources
        run: |
          find src -name "*.java" > sources.txt
          javac -encoding UTF-8 --release 8 -sourcepath src -d bin @sources.txt

      - name: Build JAR
        run: |
          printf "Main-Class: main.MainClass\n\n" > MANIFEST.MF
          jar cfm PlatformerGame.jar MANIFEST.MF -C bin .

      - name: Create site
        run: |
          mkdir -p _site
          cp PlatformerGame.jar _site/

      - name: Write index.html
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <title>Kings &amp; Pigs</title>
            <script>
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(r => r.forEach(reg => reg.unregister()));
              }
            </script>
            <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
            <style>
              body {
                background: #0c0a23;
                margin: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                color: white;
                font-family: sans-serif;
              }
              /* ĐỂ CHEERPJ TỰ TẠO THẺ, TA CHỈ CSS KÍCH THƯỚC */
              cheerpj-display {
                width: 640px !important;
                height: 448px !important;
                border: 2px solid #556;
                box-shadow: 0 10px 30px rgba(0,0,0,0.8);
              }
              p { margin-top: 20px; font-size: 12px; color: #889; }
            </style>
          </head>
          <body>
            
            <script>
              async function bootGame() {
                try {
                  // Chỉ gọi Init cơ bản nhất
                  await cheerpjInit();
                  
                  // Chạy thẳng JAR
                  let basePath = new URL('.', window.location.href).pathname;
                  let jarPath = ('/app' + basePath + 'PlatformerGame.jar').replace(/\/\//g, '/');
                  await cheerpjRunJar(jarPath);
                } catch (e) {
                  console.error("Lỗi:", e);
                }
              }
              bootGame();
            </script>
            <p>A D: Di chuyển | W/Space: Nhảy | J/Click: Tấn công</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
