name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          printf "Main-Class: main.MainClass\n\n" > MANIFEST.MF
          jar cfm PlatformerGame.jar MANIFEST.MF -C bin .
          ls -lh PlatformerGame.jar

      - name: Create site
        run: |
          mkdir -p _site
          cp PlatformerGame.jar _site/
          ls -lh _site/

      - name: Write index.html
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <title>Platformer Game</title>
            <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
            <style>
              * { margin:0; padding:0; box-sizing:border-box; }
              body {
                background:#0c0a23; display:flex; flex-direction:column;
                align-items:center; justify-content:center;
                min-height:100vh; font-family:Arial,sans-serif;
                color:#fff; gap:16px;
              }
              h1 { color:#a0c4ff; font-size:22px; }
              .sub { color:#556; font-size:13px; }
              .spinner {
                width:36px; height:36px; border:3px solid #223;
                border-top-color:#4e9af1; border-radius:50%;
                animation:spin .8s linear infinite;
              }
              @keyframes spin { to { transform:rotate(360deg); } }
              #status { font-size:13px; color:#88a; }
              kbd { background:#1a1a2e; border:1px solid #334; border-radius:3px; padding:1px 6px; font-size:11px; color:#aac; }
            </style>
          </head>
          <body>
            <h1>🎮 Platformer Game</h1>
            <p class="sub">OOP Lab Final · HK2 2025-2026 · HCMIU</p>
            <div class="spinner"></div>
            <div id="status">Đang tải game (~30 giây)...</div>
            <cheerpj-display style="display:none"></cheerpj-display>
            <p id="keys" style="display:none;font-size:12px;color:#445;text-align:center;line-height:2">
              <kbd>A</kbd> <kbd>D</kbd> di chuyển &nbsp;|&nbsp;
              <kbd>W</kbd> nhảy &nbsp;|&nbsp;
              <kbd>J</kbd> tấn công &nbsp;|&nbsp;
              <kbd>E</kbd> mở cửa &nbsp;|&nbsp;
              <kbd>Esc</kbd> pause
            </p>
            <script>
              (async () => {
                const status = document.getElementById('status');
                try {
                  await cheerpjInit({ clipboardMode:'system' });
                  document.querySelector('.spinner').style.display = 'none';
                  status.style.display = 'none';
                  document.querySelector('cheerpj-display').style.display = 'block';
                  document.getElementById('keys').style.display = 'block';
                  await cheerpjRunJar('/app/PlatformerGame.jar');
                } catch(e) {
                  status.textContent = 'Lỗi: ' + e.message;
                }
              })();
            </script>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
