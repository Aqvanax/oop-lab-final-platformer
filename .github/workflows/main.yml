name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java sources
        run: |
          find src -name "*.java" > sources.txt
          javac -encoding UTF-8 -sourcepath src -d bin @sources.txt
          echo "Compile done"

      - name: Build JAR
        run: |
          printf "Main-Class: main.MainClass\n\n" > MANIFEST.MF
          jar cfm PlatformerGame.jar MANIFEST.MF -C bin .
          ls -lh PlatformerGame.jar

      - name: Create site
        run: |
          mkdir -p _site
          cp PlatformerGame.jar _site/

      - name: Write index.html
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <title>Kings &amp; Pigs — Platformer</title>
            <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                background: #0c0a23;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                font-family: Arial, sans-serif;
                color: #fff;
              }
              h1  { font-size: 20px; color: #a0c4ff; }
              .sub { font-size: 12px; color: #667; }
              /* wrapper giữ display + overlay cùng vị trí */
              #game-wrapper {
                position: relative;
                width: 640px; height: 448px;
                border: 2px solid #334;
              }
              cheerpj-display {
                display: block;
                width: 640px; height: 448px;
              }
              /* overlay hiện trên display trong khi Java đang khởi động */
              #java-loading {
                position: absolute;
                inset: 0;
                background: #0a0818;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                pointer-events: none;
                transition: opacity 0.5s;
              }
              #java-loading.hidden { opacity: 0; pointer-events: none; }
              .spinner {
                width: 36px; height: 36px;
                border: 3px solid #1a1a3a;
                border-top-color: #4e9af1;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
              }
              @keyframes spin { to { transform: rotate(360deg); } }
              #status { font-size: 13px; color: #88a; text-align: center; line-height: 1.6; }
              /* loading toàn trang — trước khi CheerpJ init */
              #page-loading { display: flex; flex-direction: column; align-items: center; gap: 10px; }
              #focus-hint {
                font-size: 12px; color: #667;
                display: none;
                animation: pulse 2s ease-in-out infinite;
              }
              @keyframes pulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
              .keys { font-size: 12px; color: #556; text-align: center; line-height: 2.2; }
              kbd {
                background: #1a1a2e; border: 1px solid #334;
                border-radius: 3px; padding: 1px 6px;
                font-size: 11px; color: #aac;
              }
            </style>
          </head>
          <body>
            <div id="err-banner" style="display:none;position:fixed;top:0;left:0;right:0;
              background:#c0392b;color:#fff;padding:10px 14px;font:13px monospace;
              word-break:break-all;z-index:9999"></div>

            <h1>🎮 Kings &amp; Pigs</h1>
            <p class="sub">OOP Lab Final · HCMIU HK2 2025-2026</p>

            <!-- loading toàn trang: hiện khi CheerpJ chưa init -->
            <div id="page-loading">
              <div class="spinner"></div>
              <div id="page-status">Đang tải CheerpJ runtime (~8 MB lần đầu)...</div>
            </div>

            <!-- wrapper: display + overlay xếp chồng — hiện ngay từ đầu -->
            <div id="game-wrapper">
              <cheerpj-display width="640" height="448"></cheerpj-display>
              <!-- overlay hiện khi Java đang khởi động -->
              <div id="java-loading">
                <div class="spinner"></div>
                <div id="status">
                  Đang khởi động game Java...<br>
                  <small style="color:#556">CheerpJ chậm hơn native — chờ 1-2 phút</small>
                </div>
              </div>
            </div>

            <p id="focus-hint">👆 Click vào màn hình để bàn phím hoạt động</p>

            <p class="keys">
              <kbd>A</kbd> <kbd>D</kbd> di chuyển &nbsp;|&nbsp;
              <kbd>W</kbd> / <kbd>Space</kbd> nhảy &nbsp;|&nbsp;
              <kbd>J</kbd> / Click trái tấn công &nbsp;|&nbsp;
              <kbd>E</kbd> mở cửa &nbsp;|&nbsp;
              <kbd>Esc</kbd> pause
            </p>

            <script>
              // Bắt mọi lỗi uncaught (kể cả từ CheerpJ nội bộ)
              window.addEventListener('unhandledrejection', ev => {
                const msg = ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason);
                showError('Unhandled: ' + msg);
              });
              function showError(msg) {
                const el = document.getElementById('err-banner');
                el.textContent = '❌ ' + msg;
                el.style.display = 'block';
              }

              (async () => {
                const pageLoading = document.getElementById('page-loading');
                const pageStatus  = document.getElementById('page-status');
                const wrapper     = document.getElementById('game-wrapper');
                const javaLoading = document.getElementById('java-loading');
                const hint        = document.getElementById('focus-hint');

                try {
                  // Bước 1: init CheerpJ runtime
                  // clipboardMode 'java' thay vì 'system' để tránh lỗi StorageArea
                  await cheerpjInit({ clipboardMode: 'java' });

                  // Bước 2: ẩn loading trang, hiện focus hint
                  pageLoading.style.display = 'none';
                  hint.style.display        = 'block';

                  // Bước 3: sau 90 giây tự ẩn overlay (Java thường khởi động xong trước đó)
                  setTimeout(() => {
                    javaLoading.classList.add('hidden');
                  }, 90000);

                  // Click vào display cũng ẩn overlay (game đã render = user có thể thấy)
                  wrapper.addEventListener('click', () => {
                    javaLoading.classList.add('hidden');
                  }, { once: true });

                  // Kiểm tra JAR tồn tại trước khi chạy
                  const jarCheck = await fetch('./PlatformerGame.jar', {method:'HEAD'});
                  if (!jarCheck.ok) throw new Error('JAR not found: ' + jarCheck.status + ' at ' + location.href);
                  console.log('[CheerpJ] JAR OK:', jarCheck.status);

                  // /app/ map về server root → cần include subpath của GitHub Pages
                  await cheerpjRunJar('/app/oop-lab-final-platformer/PlatformerGame.jar');

                } catch (e) {
                  const msg = e && e.message ? e.message : String(e);
                  showError('CheerpJ: ' + msg);
                  console.error('[CheerpJ]', e);
                }
              })();
            </script>
          </body>
          </html>
          EOF
          echo "Done. Files in _site/:"
          ls -lh _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Print URL
        run: echo "Game live at ${{ steps.deploy.outputs.page_url }}"
